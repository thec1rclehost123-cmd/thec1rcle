# Production Docker Compose for The C1rcle Backend
# Usage on Server: docker compose -f docker-compose.prod.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: c1rcle-redis-prod
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: c1rcle-api-prod
    restart: always
    ports:
      - "4000:4000"
    # In production, we don't load .env.development. 
    # We pass the real .env file that lives securely on the server.
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
