name: Deploy Staging

on:
  push:
    branches:
      - staging

# CI (ci.yml) already validated lint + type-check + tests + build
# before this code could merge to staging via branch protection.
# No redundant validation step needed here — just deploy.

jobs:
  sonar-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-console, guest-portal, partner-dashboard]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Project IDs
        id: vars
        run: |
          if [ "${{ matrix.app }}" == "admin-console" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ matrix.app }}" == "guest-portal" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_GUEST }}" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ matrix.app }}" == "partner-dashboard" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_PARTNER }}" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.vars.outputs.pid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-version: latest
          working-directory: ${{ matrix.app == 'admin-console' && './' || format('apps/{0}', matrix.app) }}

  deploy-services:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project staging --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive --force

      - name: Build and Push API Gateway Image
        if: env.GCP_SA_KEY != ''
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | docker login -u _json_key --password-stdin https://gcr.io
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest -f apps/api-gateway/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest
