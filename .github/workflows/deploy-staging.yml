name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run lint

      - name: Run Type Checking
        run: npm run type-check

      - name: Run Unit Tests
        run: npx turbo run test --filter=@c1rcle/core

  sonar-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-web:
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-console, guest-portal, partner-dashboard]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Project IDs
        id: vars
        run: |
          if [ "${{ matrix.app }}" == "admin-console" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" >> "$GITHUB_OUTPUT"; echo "domain=staging-admin.thec1rcle.com" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ matrix.app }}" == "guest-portal" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_GUEST }}" >> "$GITHUB_OUTPUT"; echo "domain=staging.thec1rcle.com" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ matrix.app }}" == "partner-dashboard" ]; then echo "pid=${{ secrets.VERCEL_PROJECT_ID_PARTNER }}" >> "$GITHUB_OUTPUT"; echo "domain=staging-partner.thec1rcle.com" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.vars.outputs.pid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-version: latest
          working-directory: ${{ matrix.app == 'admin-console' && './' || format('apps/{0}', matrix.app) }}

  deploy-services:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project staging --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive --force

      - name: Build and Push API Gateway Image
        if: env.GCP_SA_KEY != ''
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | docker login -u _json_key --password-stdin https://gcr.io
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest -f apps/api-gateway/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest
