name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Proper CI: Validation Checks
      - name: Run Linting
        run: npm run lint

      - name: Run Type Checking
        run: npx turbo build

      - name: Run Automated Tests
        run: npm test

      # Security Scanning (Snyk)
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      # Deployment Steps...
      - name: Deploy Admin Console to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: apps/admin-console
          alias-domains: staging-admin.thec1rcle.com

      - name: Deploy Guest Portal to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_GUEST }}
          working-directory: apps/guest-portal
          alias-domains: staging.thec1rcle.com

      - name: Deploy Partner Dashboard to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PARTNER }}
          working-directory: apps/partner-dashboard
          alias-domains: staging-partner.thec1rcle.com

      # 2. Deploy Firebase Functions
      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project staging --token ${{ secrets.FIREBASE_TOKEN }}

      # 3. Deploy API Gateway (Example for Cloud Run)
      # Note: This requires Google Cloud setup (GCP_SA_KEY)
      - name: Build and Push API Gateway Image
        if: env.GCP_SA_KEY != ''
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | docker login -u _json_key --password-stdin https://gcr.io
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest -f apps/api-gateway/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:latest
