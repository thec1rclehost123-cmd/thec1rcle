name: Deploy Staging

on:
  push:
    branches:
      - staging

# CI (ci.yml) already validated lint + type-check + tests + build
# before this code could merge to staging via branch protection.
# No redundant validation step needed here — just deploy.

jobs:
  sonar-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-gateway:
    runs-on: ubuntu-latest
    outputs:
      gateway_url: ${{ steps.gateway-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Build & push to GCR
        run: |
          gcloud builds submit apps/api-gateway \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:${{ github.sha }}
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy api-gateway \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID_STAGING }}/api-gateway:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
      - name: Capture gateway URL
        id: gateway-url
        run: |
          URL=$(gcloud run services describe api-gateway --region us-central1 --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gateway deployed at: $URL"

  deploy-web:
    runs-on: ubuntu-latest
    needs: [sonar-analysis, deploy-gateway]
    strategy:
      fail-fast: false
      matrix:
        app: [admin-console, guest-portal, partner-dashboard]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Project IDs
        id: vars
        run: |
          case "${{ matrix.app }}" in
            admin-console)      echo "pid=${{ secrets.VERCEL_PROJECT_ID_ADMIN_CONSOLE }}" >> "$GITHUB_OUTPUT" ;;
            guest-portal)       echo "pid=${{ secrets.VERCEL_PROJECT_ID_GUEST_PORTAL }}" >> "$GITHUB_OUTPUT" ;;
            partner-dashboard)  echo "pid=${{ secrets.VERCEL_PROJECT_ID_PARTNER_DASHBOARD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set Gateway URL
        if: matrix.app == 'partner-dashboard'
        run: |
          GATEWAY_URL="${{ needs.deploy-gateway.outputs.gateway_url }}"
          npx vercel env add GATEWAY_URL preview --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --environment=preview <<< "$GATEWAY_URL" || true
          npx vercel env add GATEWAY_URL production --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --environment=production <<< "$GATEWAY_URL" || true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.vars.outputs.pid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-version: latest
          working-directory: ${{ matrix.app == 'admin-console' && './' || format('apps/{0}', matrix.app) }}

  deploy-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project staging --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive --force
