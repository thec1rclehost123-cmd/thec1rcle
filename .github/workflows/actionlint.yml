name: Actionlint

on:
  pull_request:
    branches: [main, staging]
    paths:
      - ".github/workflows/**"
  push:
    branches: [main, staging]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
