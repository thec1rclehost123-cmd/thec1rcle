name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read
  issues: write
  pull-requests: write
  # Enables Turbo remote cache — add TURBO_TOKEN to repo secrets

jobs:
  # ── 1. Shared setup ──────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-

    # ── 2. Lint & format (all workspaces via Turbo) ──────────────
  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo lint --filter='...[origin/main]'
      - name: Prettier (changed files only)
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD --diff-filter=ACMRT || true)
          FILTERED=$(echo "$CHANGED" | grep -E '\.(js|jsx|ts|tsx|mjs|cjs|json|css|md|html|yaml|yml)$' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED" | xargs npx prettier --check
          else
            echo "No changed formattable files to check"
          fi

    # ── 3. TypeScript across all packages ────────────────────────
  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo type-check

    # ── 4. Tests ─────────────────────────────────────────────────
  test:
    name: Tests
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: apps/guest-portal
            test-command: echo "No tests for guest-portal"
          - workspace: apps/partner-dashboard
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/admin-console
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/api-gateway
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: packages/core
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/mobile-app
            test-command: echo "No tests for mobile-app"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - name: Run tests
        run: |
          cd ${{ matrix.workspace }}
          ${{ matrix.test-command }}
      - uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        if: always()
        continue-on-error: true
        with:
          flags: ${{ matrix.workspace }}
          fail_ci_if_error: false

    # ── 5. Build all affected packages ───────────────────────────
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo build --filter='...[origin/main]'

    # ── 6. Security ───────────────────────────────────────────────
  security:
    name: Security
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - name: npm audit
        run: npm audit --audit-level=high --workspaces
        continue-on-error: true
      - uses: trufflesecurity/trufflehog@84a2b33c9f891494db6ebe02f2a55b19cdf38f25
        continue-on-error: true
        with: { extra_args: --only-verified }

  summary-comment:
    name: CI Summary Comment
    needs: [lint, typecheck, test, build, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const marker = '<!-- c1rcle-ci-summary -->';
            const rows = [
              ['Lint & Format', '${{ needs.lint.result }}'],
              ['Type Check', '${{ needs.typecheck.result }}'],
              ['Tests', '${{ needs.test.result }}'],
              ['Build', '${{ needs.build.result }}'],
              ['Security', '${{ needs.security.result }}'],
            ];
            const icon = (result) => result === 'success' ? '✓' : result === 'skipped' ? '-' : '✗';
            const table = rows.map(([name, result]) => `| ${icon(result)} | ${name} | ${result} |`).join('\n');
            const body = `${marker}\n## CI Summary\n\n| Status | Check | Result |\n|---|---|---|\n${table}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

