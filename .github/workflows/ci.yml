name: CI

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ── 1a. Verify: Prettier + Stylelint (no build dependency) ────
  verify-format:
    name: Verify / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags --depth=500 origin ${{ github.base_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prettier check (changed files vs base branch)
        shell: bash
        run: |
          set -eo pipefail
          git diff -z --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css' '*.scss' '*.md' \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/.next/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)**/coverage/**' \
            ':(exclude)**/build/**' \
            ':(exclude)**/.turbo/**' \
            ':(exclude)package-lock.json' \
            > /tmp/prettier-changed.txt

          if [ ! -s /tmp/prettier-changed.txt ]; then
            echo "No prettier-relevant files changed vs origin/${{ github.base_ref }} — skipping."
            exit 0
          fi

          echo "Checking formatting on:"
          tr '\0' '\n' < /tmp/prettier-changed.txt
          xargs -0 npx prettier --check < /tmp/prettier-changed.txt

      - name: Stylelint check
        run: npm run stylelint:check

  # ── 1b. Verify: Build shared packages, Lint, Type-Check, Test ─
  verify-test:
    name: Verify / Test
    runs-on: ubuntu-latest
    env:
      DEV_TOY_MODE: 'true'
      QUEUE_SECRET_KEY: ci-test-key
      TICKET_SECRET: ci-test-key
      QR_SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build shared packages
        run: npx turbo build --filter=@c1rcle/types --filter=@c1rcle/core

      - name: Run lint, typecheck, test
        run: npx turbo run lint type-check test --output-logs=new-only

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── 2. Build affected ─────────────────────────────────────────
  build:
    name: Build Affected
    needs: [verify-format, verify-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags --depth=500 origin ${{ github.base_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build affected packages
        run: npx turbo build --filter='...[origin/${{ github.base_ref }}]'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SKIP_ENV_VALIDATION: '1'

  # ── 3. Security ───────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical --omit=optional

      - name: Secret scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          extra_args: --only-verified
