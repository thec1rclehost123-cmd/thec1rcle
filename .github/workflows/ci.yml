name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Enables Turbo remote cache — add TURBO_TOKEN to repo secrets

jobs:
  # ── 1. Shared setup ──────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-

    # ── 2. Lint & format (all workspaces via Turbo) ──────────────
  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo lint --filter='...[origin/main]'
      - name: Prettier (changed files only)
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD --diff-filter=ACMRT || true)
          FILTERED=$(echo "$CHANGED" | grep -E '\.(js|jsx|ts|tsx|mjs|cjs|json|css|md|html|yaml|yml)$' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED" | xargs npx prettier --check
          else
            echo "No changed formattable files to check"
          fi

    # ── 3. TypeScript across all packages ────────────────────────
  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo type-check

    # ── 4. Tests ─────────────────────────────────────────────────
  test:
    name: Tests
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: apps/guest-portal
            test-command: echo "No tests for guest-portal"
          - workspace: apps/partner-dashboard
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/admin-console
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/api-gateway
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: packages/core
            test-command: npx vitest run --coverage --passWithNoTests
          - workspace: apps/mobile-app
            test-command: echo "No tests for mobile-app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - name: Run tests
        run: |
          cd ${{ matrix.workspace }}
          ${{ matrix.test-command }}
      - uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          flags: ${{ matrix.workspace }}
          fail_ci_if_error: false

    # ── 5. Build all affected packages ───────────────────────────
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - run: npx turbo build --filter='...[origin/main]'

    # ── 6. Security ───────────────────────────────────────────────
  security:
    name: Security
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-
      - name: npm audit
        run: npm audit --audit-level=high --workspaces
        continue-on-error: true
      - uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with: { extra_args: --only-verified }

