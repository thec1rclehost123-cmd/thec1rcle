name: Code Quality (Extended)

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  schedule:
    # Weekly thorough check: Sunday 04:00 IST (22:30 UTC Saturday)
    - cron: "30 22 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused-code:
    name: Unused Code (Knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npx knip

  spellcheck:
    name: Spell Check (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npx cspell --no-progress "**/*.{js,ts,tsx,jsx,md,json}"
        continue-on-error: true

  bundle-size:
    name: Bundle Size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npm run build --if-present
      - run: npx size-limit

  guardrails:
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npm run guardrails:check
      - run: npm run test:guardrails
      - run: npm --workspace=apps/guest-portal run type-check
      - run: npm --workspace=apps/api-gateway test

  stylelint:
    name: Stylelint (CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npm run stylelint:check

  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npm run build --if-present
      - run: npx @lhci/cli autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
