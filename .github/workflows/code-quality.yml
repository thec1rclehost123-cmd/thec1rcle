name: Code Quality (Extended)

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  schedule:
    # Weekly thorough check: Sunday 04:00 IST (22:30 UTC Saturday)
    - cron: '30 22 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared setup ─────────────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  unused-code:
    name: Unused Code (Knip)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
      - run: npx knip
        continue-on-error: true

  spellcheck:
    name: Spell Check (cspell)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
      - run: npx cspell --no-progress --gitignore "**/*.{js,ts,tsx,jsx,md,json}"
        continue-on-error: true

  build:
    name: Build (for size-limit)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
      - run: npx turbo build --filter=@c1rcle/guest-portal --filter=@c1rcle/partner-dashboard --filter=@c1rcle/admin-console --filter=@c1rcle/api-gateway
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SKIP_ENV_VALIDATION: '1'
      - uses: actions/cache@v4
        with:
          path: |
            apps/guest-portal/.next
            apps/partner-dashboard/.next
            apps/admin-console/.next
            apps/api-gateway/dist
          key: build-cq-${{ runner.os }}-${{ github.sha }}

  bundle-size:
    name: Bundle Size (size-limit)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        with:
          path: |
            apps/guest-portal/.next
            apps/partner-dashboard/.next
            apps/admin-console/.next
            apps/api-gateway/dist
          key: build-cq-${{ runner.os }}-${{ github.sha }}
      - run: npx size-limit
        continue-on-error: true

  guardrails:
    name: Architecture Guardrails
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-cq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
      - run: npm run guardrails:check
      - run: npm run test:guardrails
      - run: npm run architecture:guest
      - run: npm --workspace=apps/guest-portal run type-check
      - run: npm --workspace=apps/guest-portal test
      - run: npm --workspace=packages/core run build
      - run: npm --workspace=apps/api-gateway test
