name: Code Quality (Extended)

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  schedule:
    # Weekly thorough check: Sunday 04:00 IST (22:30 UTC Saturday)
    - cron: '30 22 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused-code:
    name: Unused Code (Knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx knip
        continue-on-error: true

  spellcheck:
    name: Spell Check (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx cspell --no-progress "**/*.{js,ts,tsx,jsx,md,json}"
        continue-on-error: true

  bundle-size:
    name: Bundle Size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx size-limit
        continue-on-error: true

  guardrails:
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run guardrails:check
      - run: npm run test:guardrails
      - run: npm run architecture:guest
      - run: npm --workspace=apps/guest-portal run type-check
      - run: npm --workspace=apps/guest-portal test
      - run: npm --workspace=packages/core run build
      - run: npm --workspace=apps/api-gateway test

  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build --if-present
        env:
          SKIP_ENV_VALIDATION: '1'
      - run: npx lhci autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
