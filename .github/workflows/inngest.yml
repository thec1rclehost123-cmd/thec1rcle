name: Inngest Sync

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

jobs:
  sync:
    name: Sync Inngest functions
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: guest-portal
            url: ${{ vars.GUEST_URL }}/api/inngest
          - app: api-gateway
            url: ${{ vars.BACKEND_URL }}/api/inngest
    steps:
      - name: Ping Inngest deploy hook
        run: |
          curl -f -X PUT "${{ matrix.url }}" \
            -H "x-inngest-sync-kind: trust" \
            -H "Authorization: Bearer ${{ secrets.INNGEST_SIGNING_KEY }}"

  verify:
    name: Verify sync
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Check function list via Inngest API
        run: |
          curl -f "https://api.inngest.com/v1/apps" \
            -H "Authorization: Bearer ${{ secrets.INNGEST_API_KEY }}" \
            | jq '.data[] | {name, sync_id, status}'
