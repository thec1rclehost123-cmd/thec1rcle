name: Mobile EAS Build

on:
  push:
    branches: [main, staging]
    paths:
      - apps/mobile-app/**
      - apps/scanner-app/**
      - packages/core/**
      - packages/ui/**
      - packages/types/**


jobs:
  eas-build:
    name: EAS Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile-app, scanner-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build (preview)
        id: build-preview
        if: github.ref != 'refs/heads/main'
        run: |
          cd apps/${{ matrix.app }}
          eas build --platform all --profile preview --non-interactive
      - name: EAS Build (production)
        id: build-production
        if: github.ref == 'refs/heads/main'
        run: |
          cd apps/${{ matrix.app }}
          eas build --platform all --profile production --non-interactive
      - name: EAS Submit (production)
        if: github.ref == 'refs/heads/main' && steps.build-production.outcome == 'success'
        run: |
          cd apps/${{ matrix.app }}
          eas submit --platform all --non-interactive

  expo-updates:
    name: OTA Update (EAS Update)
    if: github.ref == 'refs/heads/main'
    needs: eas-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: cd apps/mobile-app && eas update --branch production --message "$COMMIT_MSG"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
