name: Mobile EAS Build

on:
  push:
    branches: [main, staging]
    paths:
      - apps/mobile-app/**
      - apps/scanner-app/**
      - packages/core/**
      - packages/ui/**
      - packages/types/**

jobs:
  eas-build:
    name: EAS Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile-app, scanner-app]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build (preview)
        if: github.ref != 'refs/heads/main'
        run: |
          cd apps/${{ matrix.app }}
          eas build --platform all --profile preview --non-interactive
      - name: EAS Build (production)
        if: github.ref == 'refs/heads/main'
        run: |
          cd apps/${{ matrix.app }}
          eas build --platform all --profile production --non-interactive
          eas submit --platform all --non-interactive

  expo-updates:
    name: OTA Update (EAS Update)
    if: github.ref == 'refs/heads/main'
    needs: eas-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: 20, cache: npm }
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: |
          cd apps/mobile-app && eas update --branch production --message "$EAS_UPDATE_MESSAGE"
        env:
          EAS_UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
