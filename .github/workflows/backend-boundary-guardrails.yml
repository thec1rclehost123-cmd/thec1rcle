name: Backend Boundary Guardrails

on:
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run guardrails:check

      - run: npm run test:guardrails

      - run: npm --workspace=apps/api-gateway test
