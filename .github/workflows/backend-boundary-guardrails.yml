name: Backend Boundary Guardrails

on:
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run guardrails:check

      - run: npm run test:guardrails

      - name: Guest architecture snapshot
        run: npm run architecture:guest
        continue-on-error: true

      - run: npm --workspace=apps/guest-portal run type-check

      - name: Guest portal tests
        run: npm --workspace=apps/guest-portal test
        continue-on-error: true

      - name: API gateway tests
        run: npm --workspace=apps/api-gateway test
        continue-on-error: true
