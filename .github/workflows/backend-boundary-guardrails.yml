name: Backend Boundary Guardrails

on:
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - run: npx turbo type-check

      - run: npx turbo lint
