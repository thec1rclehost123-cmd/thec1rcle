name: Daily Health Check

on:
  schedule:
    # Runs at 02:00 IST (20:30 UTC) every day
    - cron: "30 20 * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Run Smoke Tests
        run: |
          node scripts/smoke-test.js
        env:
          STAGING_GUEST_URL: "https://thec1rcle-guest-portal-git-staging-thec1rcles-projects.vercel.app/"
          STAGING_ADMIN_URL: "https://thec1rcle-admin-panel-git-staging-thec1rcles-projects.vercel.app/"
          STAGING_API_URL: "https://thec1rcle-partner-dashboard-git-staging-thec1rcles-projects.vercel.app/api/health"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Staging Health Check Failed! Please check the logs."
          # Here you could add a step to send a Slack or Discord webhook
