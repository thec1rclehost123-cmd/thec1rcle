name: Release

on:
  push:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  GCP_REGION: us-central1
  GCR_HOSTNAME: gcr.io

jobs:
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - guest-portal
          - partner-dashboard
          - admin-console
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm }
      - run: npm install --legacy-peer-deps
      - run: npx turbo build --filter=@c1rcle/${{ matrix.app }}
      - name: Set Vercel project ID
        id: vars
        run: |
          case "${{ matrix.app }}" in
            guest-portal)         echo "pid=${{ secrets.VERCEL_PROJECT_ID_GUEST_PORTAL }}" >> "$GITHUB_OUTPUT" ;;
            partner-dashboard)    echo "pid=${{ secrets.VERCEL_PROJECT_ID_PARTNER_DASHBOARD }}" >> "$GITHUB_OUTPUT" ;;
            admin-console)        echo "pid=${{ secrets.VERCEL_PROJECT_ID_ADMIN_CONSOLE }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vars.outputs.pid }}

  deploy-api-gateway:
    name: Deploy API Gateway (GCR)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Build & push to GCR
        run: |
          gcloud builds submit apps/api-gateway \
            --tag ${{ env.GCR_HOSTNAME }}/${{ vars.GCP_PROJECT }}/api-gateway:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy api-gateway \
            --image ${{ env.GCR_HOSTNAME }}/${{ vars.GCP_PROJECT }}/api-gateway:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  sentry-release:
    name: Sentry Release
    needs: [deploy-web, deploy-api-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: { fetch-depth: 0 }
      - uses: getsentry/action-release@a74facf8a080ecbdf1cb355f16743530d712abb7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: ./apps/guest-portal/.next
